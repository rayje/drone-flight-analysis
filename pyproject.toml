[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "drone-flight-analysis"
version = "0.1.0"
description = "Modular analysis of Firefly Gen 2 PX4 flight logs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pyulog>=1.1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
drone-flight-analysis = "drone_flight_analysis.cli:main"
drone-flight-events = "drone_flight_analysis.events_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
